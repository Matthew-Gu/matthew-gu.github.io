<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="CodePen-friendly streaming Markdown renderer demo" />
		<title>Streaming Markdown Demo</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="./style.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-light.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" />
		<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
	</head>
	<body>
		<div class="chat-container">
			<div id="message-wrapper" class="message-out-wrapper">
				<div id="message-list"></div>
			</div>
			<div class="input-area">
				<textarea id="text-area" placeholder="输入消息，按 Enter 发送，Shift + Enter 换行"></textarea>
				<div class="input-actions">
					<button id="send-btn">发送</button>
				</div>
			</div>
		</div>
		<script type="module" src="./src/app.js"></script>
	</body>
</html>
